<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101523">
  <title>Cloud Computing — Présentation interactive</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101523;
      --panel: #171e2e;
      --panel-2: #1d2638;
      --line: #2a354a;
      --text: #edf2fb;
      --muted: #a4b0c5;
      --accent: #9c8cff;
      --accent-2: #73dfc1;
      --amber: #f3c879;
      --red: #ff959c;
      --radius: 18px;
      --shadow: 0 18px 50px #05081166;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 70% -20%, #282653 0, transparent 40%),
        var(--bg);
      color: var(--text);
      font: 15px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    a { color: var(--accent-2); }
    button:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible {
      outline: 3px solid var(--accent-2);
      outline-offset: 3px;
    }
    .shell { display: grid; grid-template-columns: 258px minmax(0, 1fr); min-height: 100vh; }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 26px 18px 18px;
      background: #111827eF;
      border-right: 1px solid var(--line);
      backdrop-filter: blur(16px);
      z-index: 3;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 26px; }
    .brand-mark {
      width: 42px; height: 42px; display: grid; place-items: center;
      color: #141626; font-weight: 900; border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 8px 28px #9c8cff35;
    }
    .brand strong { display: block; font-size: 13px; letter-spacing: .03em; }
    .brand span { display: block; color: var(--muted); font-size: 11px; }
    .nav-label { padding: 8px 10px; color: #748198; font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .nav-list { display: grid; gap: 5px; }
    .nav-item {
      display: flex; align-items: center; gap: 12px; width: 100%;
      padding: 11px 12px; border: 1px solid transparent; border-radius: 12px;
      background: transparent; color: var(--muted); text-align: left; cursor: pointer;
      transition: .18s ease;
    }
    .nav-item:hover { background: #ffffff08; color: var(--text); }
    .nav-item.active { color: var(--text); border-color: #9c8cff35; background: #9c8cff15; }
    .nav-number { width: 25px; height: 25px; display: grid; place-items: center; border-radius: 8px; background: #ffffff0b; font-size: 11px; font-weight: 800; }
    .nav-item.active .nav-number { color: #171629; background: var(--accent); }
    .nav-name { font-size: 13px; font-weight: 650; }
    .sidebar-bottom { margin-top: auto; display: grid; gap: 10px; }
    .side-note { padding: 13px; border: 1px solid var(--line); border-radius: 14px; color: var(--muted); font-size: 11px; }
    .side-note strong { display: block; margin-bottom: 4px; color: var(--text); }
    .side-link { padding: 10px 12px; border-radius: 11px; background: #ffffff08; text-decoration: none; font-size: 12px; }

    main { min-width: 0; padding: 0 38px 56px; }
    .topbar {
      position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 17px 0; background: #101523e8; border-bottom: 1px solid #2a354a99;
      backdrop-filter: blur(16px); z-index: 2;
    }
    .crumb { color: var(--muted); font-size: 12px; }
    .crumb strong { color: var(--text); font-weight: 700; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .icon-button, .search-wrap {
      min-height: 38px; border: 1px solid var(--line); border-radius: 11px; background: #171e2e;
    }
    .icon-button { padding: 7px 11px; cursor: pointer; color: var(--muted); font-size: 12px; }
    .icon-button:hover { border-color: #596786; color: var(--text); }
    .search-wrap { display: flex; align-items: center; gap: 8px; padding: 0 10px; }
    .search-wrap span { color: var(--muted); }
    .search-wrap input { width: 180px; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 12px; }
    .search-wrap input::placeholder { color: #77839a; }

    .content { width: min(1120px, 100%); margin: 0 auto; }
    .hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; padding: 47px 0 24px; }
    .eyebrow { color: var(--accent-2); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 8px 0 8px; font-size: clamp(30px, 4vw, 46px); line-height: 1.12; letter-spacing: -.04em; }
    .hero p { max-width: 720px; margin: 0; color: var(--muted); font-size: 15px; }
    .hero-tools { display: flex; flex-wrap: wrap; gap: 8px; flex-shrink: 0; }
    .primary-button, .soft-button {
      border: 0; border-radius: 11px; padding: 10px 14px; cursor: pointer;
      font-size: 12px; font-weight: 750; transition: .18s ease;
    }
    .primary-button { background: var(--accent); color: #171629; }
    .primary-button:hover { background: #b0a5ff; transform: translateY(-1px); }
    .soft-button { border: 1px solid var(--line); background: var(--panel); color: var(--text); }
    .soft-button:hover { border-color: #596786; }

    .section-heading { display: flex; justify-content: space-between; align-items: end; gap: 14px; margin: 30px 0 14px; }
    .section-heading h2 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
    .section-heading p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .section-kicker { color: #7d89a0; font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .card { border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(145deg, #1a2233, #151c2a); box-shadow: var(--shadow); }
    .intro-card { padding: 22px; }
    .intro-line { display: flex; align-items: flex-start; gap: 14px; }
    .intro-icon { flex: 0 0 42px; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 13px; background: #73dfc11a; color: var(--accent-2); font-size: 18px; }
    .intro-card h2 { margin: 1px 0 5px; font-size: 17px; }
    .intro-card p { margin: 0; color: var(--muted); }
    .workflow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 11px; }
    .workflow-step {
      position: relative; min-height: 132px; padding: 16px; text-align: left; cursor: pointer;
      border: 1px solid var(--line); border-radius: 15px; background: #171e2e; transition: .18s ease;
    }
    .workflow-step:hover { transform: translateY(-2px); border-color: #596786; }
    .workflow-step.active { border-color: #9c8cff99; background: linear-gradient(145deg, #282342, #191f30); box-shadow: inset 0 0 0 1px #9c8cff22; }
    .step-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 13px; }
    .step-index { color: var(--accent); font-size: 11px; font-weight: 850; }
    .step-arrow { color: #62708a; }
    .workflow-step strong { display: block; font-size: 13px; }
    .workflow-step small { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .workflow-detail { display: grid; grid-template-columns: 1.3fr 1fr; gap: 15px; margin-top: 12px; padding: 17px 19px; }
    .workflow-detail h3 { margin: 0 0 4px; font-size: 14px; }
    .workflow-detail p { margin: 0; color: var(--muted); font-size: 13px; }
    .transition-box { padding-left: 15px; border-left: 2px solid var(--accent-2); }
    .transition-box span { display: block; margin-bottom: 4px; color: var(--accent-2); font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .transition-box p { color: var(--text); }

    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 11px; }
    .metric { padding: 16px; }
    .metric-label { color: var(--muted); font-size: 11px; }
    .metric-value { margin: 5px 0 2px; font-size: 23px; font-weight: 780; letter-spacing: -.04em; }
    .metric-note { color: #77839a; font-size: 10px; }
    .metric.highlight .metric-value { color: var(--accent-2); }
    .metric.warning .metric-value { color: var(--amber); }
    .two-col { display: grid; grid-template-columns: 1.1fr .9fr; gap: 14px; }
    .panel { padding: 20px; }
    .panel h3 { margin: 0 0 12px; font-size: 14px; }
    .panel p { color: var(--muted); }
    .bullet-list { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
    .bullet-list li { position: relative; padding-left: 17px; color: var(--muted); font-size: 13px; }
    .bullet-list li::before { content: ""; position: absolute; top: .7em; left: 0; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-2); }
    .callout { padding: 13px 15px; border: 1px solid #f3c87933; border-radius: 13px; background: #f3c8790b; color: #e7d4aa; font-size: 12px; }
    .callout strong { color: var(--amber); }

    .qa-list { display: grid; gap: 9px; }
    .qa {
      overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: #171e2e;
      transition: border-color .2s ease;
    }
    .qa[open] { border-color: #9c8cff66; }
    .qa summary { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; list-style: none; font-weight: 680; font-size: 13px; }
    .qa summary::-webkit-details-marker { display: none; }
    .qa summary::after { content: "+"; margin-left: auto; color: var(--accent); font-size: 19px; font-weight: 400; }
    .qa[open] summary::after { content: "−"; }
    .qa-num { flex: 0 0 24px; height: 24px; display: grid; place-items: center; border-radius: 8px; background: #9c8cff1a; color: var(--accent); font-size: 10px; }
    .qa-answer { padding: 0 17px 16px 52px; color: var(--muted); font-size: 13px; }
    .qa-answer p { margin: 0; }
    .answer-tools { display: flex; justify-content: flex-end; margin-top: 9px; }
    .copy-answer { padding: 5px 9px; border: 1px solid var(--line); border-radius: 8px; background: #ffffff06; color: var(--muted); cursor: pointer; font-size: 10px; }
    .copy-answer:hover { color: var(--text); }
    .search-status { display: none; margin: 12px 0; color: var(--muted); font-size: 12px; }
    .empty-state { display: none; padding: 22px; border: 1px dashed #596786; border-radius: 14px; color: var(--muted); text-align: center; }
    .closing { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 20px; padding: 20px; border: 1px solid #73dfc133; border-radius: var(--radius); background: linear-gradient(110deg, #73dfc111, #9c8cff0b); }
    .closing h3 { margin: 0 0 5px; font-size: 14px; }
    .closing p { margin: 0; color: var(--muted); font-size: 12px; }
    .status-tag { padding: 7px 10px; border: 1px solid #73dfc133; border-radius: 99px; color: var(--accent-2); white-space: nowrap; font-size: 10px; font-weight: 800; }
    .footer { margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--line); color: #748198; font-size: 10px; }
    .toast { position: fixed; right: 24px; bottom: 24px; padding: 11px 15px; border: 1px solid var(--line); border-radius: 12px; background: #202a3c; color: var(--text); box-shadow: var(--shadow); opacity: 0; transform: translateY(8px); pointer-events: none; transition: .2s ease; z-index: 5; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .mobile-nav { display: none; }

    @media (max-width: 1000px) {
      .shell { grid-template-columns: 220px minmax(0, 1fr); }
      main { padding: 0 24px 40px; }
      .hero { align-items: flex-start; flex-direction: column; }
      .workflow { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 700px) {
      .shell { display: block; }
      .sidebar { position: fixed; inset: auto 0 0; width: auto; height: auto; padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); border: 0; border-top: 1px solid var(--line); background: #111827f5; }
      .brand, .nav-label, .sidebar-bottom { display: none; }
      .nav-list { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px; }
      .nav-item { justify-content: center; flex-direction: column; gap: 3px; padding: 5px 2px; border-radius: 9px; }
      .nav-number { width: 21px; height: 21px; font-size: 9px; }
      .nav-name { max-width: 100%; overflow: hidden; font-size: 8px; text-overflow: ellipsis; white-space: nowrap; }
      main { padding: 0 16px 105px; }
      .topbar { padding: 12px 0; }
      .search-wrap input { width: min(32vw, 150px); }
      .hero { padding: 31px 0 14px; }
      .hero p { font-size: 13px; }
      .section-heading { margin-top: 23px; }
      .workflow { gap: 8px; }
      .workflow-step { min-height: 120px; padding: 12px; }
      .workflow-detail, .two-col { grid-template-columns: 1fr; }
      .transition-box { padding: 12px 0 0; border-left: 0; border-top: 2px solid var(--accent-2); }
      .closing { grid-template-columns: 1fr; }
      .status-tag { justify-self: start; }
    }
    @media print {
      :root { color-scheme: light; --bg: #fff; --panel: #fff; --panel-2: #f6f7fa; --line: #d7dce5; --text: #182033; --muted: #4c586c; --accent: #5142bb; --accent-2: #16785f; --amber: #8a5e00; }
      body { background: #fff; color: #182033; font-size: 11pt; }
      .shell { display: block; }
      .sidebar, .topbar, .hero-tools, .copy-answer, .toast, .footer { display: none !important; }
      main { padding: 0; }
      .content { width: 100%; }
      .card, .qa, .workflow-step { box-shadow: none; background: #fff; }
      .hero { padding-top: 0; }
      .qa:not([open]) .qa-answer { display: block; }
      .qa { break-inside: avoid; }
      .section-heading { break-after: avoid; }
      .workflow-step { min-height: auto; }
      .metric, .panel, .intro-card { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Navigation du projet">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">CC</div>
        <div><strong>CLOUD COMPUTING</strong><span>Support de présentation orale</span></div>
      </div>
      <div class="nav-label">Parcours du projet</div>
      <nav class="nav-list" id="navigation"></nav>
      <div class="sidebar-bottom">
        <div class="side-note"><strong>Repère oral</strong>Explique le besoin, la méthode, le résultat, puis la limite.</div>
        <a class="side-link" href="./Preparation_oral_cloud_computing.md" target="_blank" rel="noopener">Ouvrir le guide complet ↗</a>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div class="crumb"><span>Projet de fin de module</span> <span aria-hidden="true">/</span> <strong id="breadcrumb">Vue d’ensemble</strong></div>
        <div class="top-actions">
          <label class="search-wrap" aria-label="Rechercher une question ou un mot-clé">
            <span aria-hidden="true">⌕</span>
            <input id="search" type="search" placeholder="Chercher une question…" autocomplete="off">
          </label>
          <button class="icon-button" id="random-question" type="button" title="Afficher une question au hasard">Surprise</button>
          <button class="icon-button" id="print" type="button" title="Imprimer ou enregistrer en PDF">Imprimer</button>
        </div>
      </header>

      <div class="content" id="content"></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>
  </div>

  <script>
    const sections = [
      {
        id: "overview", nav: "Vue générale", short: "Intro", number: "01",
        eyebrow: "Votre fil conducteur",
        title: "Présenter sans réciter",
        subtitle: "Un tableau de bord oral pour retrouver rapidement la méthode, les résultats et les limites de chaque partie.",
        introTitle: "Le projet en une phrase",
        intro: "J’ai étudié le cycle complet d’un service cloud : concevoir et simuler une architecture, déployer des ressources, automatiser leur configuration, puis vérifier un objectif de disponibilité.",
        steps: [
          { title: "Concevoir", short: "Besoin universitaire", detail: "Partir des services numériques de l’université et proposer une architecture distribuée, en séparant les données publiées des hypothèses de dimensionnement.", bridge: "« À partir de ce besoin, j’ai d’abord vérifié le comportement attendu par simulation. »" },
          { title: "Simuler", short: "CloudSim Plus", detail: "Comparer charge normale et charge de pointe, ordonnanceurs et autoscaling dans un modèle contrôlé.", bridge: "« Ensuite, je suis passé d’un modèle à un laboratoire OpenStack réellement exécuté. »" },
          { title: "Déployer", short: "OpenStack + IaC", detail: "Créer une infrastructure IaaS, déployer une application, puis séparer le provisionnement (Terraform) de la configuration système (Ansible).", bridge: "« Une fois les services déployés, il fallait aussi définir comment mesurer leur disponibilité. »" },
          { title: "Mesurer", short: "SLA + supervision", detail: "Définir un indicateur vérifiable, surveiller les instances et provoquer un arrêt pour démontrer la détection d’une panne.", bridge: "« Je termine en distinguant clairement la démonstration de laboratoire d’une garantie de production. »" }
        ],
        metrics: [
          { label: "Parties", value: "4", note: "simulation, OpenStack, IaC, SLA" },
          { label: "OpenStack", value: "Local", note: "VM VirtualBox, pas de cloud externe", style: "highlight" },
          { label: "Objectif SLA", value: "99,5 %", note: "par journée, objectif défini" },
          { label: "Point de vigilance", value: "Limites", note: "modèle et laboratoire ≠ production", style: "warning" }
        ],
        methodTitle: "Méthode de réponse si le professeur rebondit",
        bullets: [
          "Répondre d’abord en une phrase directe, sans repartir de tout le projet.",
          "Préciser si l’élément est proposé, supposé, simulé ou observé dans le laboratoire.",
          "Donner ensuite le chiffre ou la commande qui justifie la réponse.",
          "Terminer par une limite ou une amélioration si la question porte sur la validité."
        ],
        callout: "À ne pas confondre : 39 812 est une estimation de simultanéité ; 300 est le nombre de tâches synthétiques du scénario de pointe.",
        transitionTitle: "Phrase d’ouverture",
        transition: "« Mon projet combine une étude de capacité simulée et un laboratoire cloud local pour mettre en pratique le déploiement, l’automatisation et la supervision. »",
        questions: [
          ["Quel est l’objectif général du projet ?", "Relier les concepts du cloud à des expériences concrètes : concevoir une architecture, simuler ses performances, déployer des ressources, automatiser leur configuration et mesurer un objectif de disponibilité."],
          ["Pourquoi quatre parties ?", "Elles suivent des étapes complémentaires : étudier la capacité, exploiter une plateforme IaaS, automatiser avec Terraform et Ansible, puis surveiller un indicateur de SLA."],
          ["Où avez-vous installé OpenStack ?", "Dans une VM Ubuntu locale sous VirtualBox. C’était une contrainte du sujet : ne pas installer OpenStack dans une VM d’un fournisseur cloud externe."],
          ["DevStack est-il destiné à la production ?", "Non. DevStack est adapté au développement et aux démonstrations. Mon installation sert de laboratoire pédagogique, pas de plateforme de production haute disponibilité."],
          ["Quelle est la limite générale de vos conclusions ?", "Les tâches de simulation sont synthétiques et l’environnement OpenStack est un laboratoire. Je démontre les mécanismes, mais ne certifie ni la capacité réelle de l’université ni un SLA de production."],
          ["Comment répondez-vous si vous ne connaissez pas un détail ?", "Je précise ce qui a été réellement mesuré et ce qui ne l’a pas été, puis j’explique comment je vérifierais le point manquant. Je préfère une limite exacte à une affirmation non démontrée."]
        ]
      },
      {
        id: "part1", nav: "Partie 1 · Simulation", short: "P1", number: "02",
        eyebrow: "Partie 1 · CloudSim Plus",
        title: "Modéliser avant de dimensionner",
        subtitle: "Architecture universitaire proposée, charge synthétique, comparaison d’ordonnanceurs et compromis performance/coût.",
        introTitle: "L’idée à expliquer",
        intro: "J’ai créé deux datacenters logiques pour comparer des scénarios normaux et de pointe. Les résultats servent à comparer les politiques du modèle, pas à certifier une capacité réelle.",
        steps: [
          { title: "Références", short: "Besoin & données", detail: "Le rapport cite 130 750 étudiants, 1 357 enseignants-chercheurs et 598 personnels. Le total de 132 705 utilisateurs potentiels est une somme d’effectifs, pas un nombre de comptes actifs.", bridge: "« Ces effectifs donnent un contexte, mais pas la charge technique. J’ai donc explicité mes hypothèses. »" },
          { title: "Architecture", short: "2 pôles logiques", detail: "Tanger : 8 hôtes et 6 VM initiales. Tétouan : 6 hôtes et 4 VM. La répartition 55 % / 45 % est une hypothèse ; ces lieux ne sont pas présentés comme des datacenters existants.", bridge: "« Une fois les ressources définies, j’ai représenté la demande par des Cloudlets synthétiques. »" },
          { title: "Charge", short: "50 vs 300 tâches", detail: "Chaque Cloudlet est mono-cœur : 5 000, 20 000 ou 50 000 MI. Les périodes normale et de pointe comportent respectivement 50 et 300 Cloudlets, arrivant en dix lots espacés de cinq secondes.", bridge: "« J’ai ensuite comparé l’ordonnancement fixe, puis l’ajout automatique de VM. »" },
          { title: "Comparaison", short: "Ordonnanceur & scaling", detail: "Comparer SpaceShared et TimeShared, puis TimeShared fixe à un scaling horizontal déclenché à 70 % CPU, plafonné à 20 VM.", bridge: "« Le résultat principal est un compromis : le scaling accélère les tâches, mais augmente le coût estimé. »" }
        ],
        metrics: [
          { label: "Effectif potentiel estimé", value: "132 705", note: "effectifs publiés additionnés" },
          { label: "Hôtes / VM initiales", value: "14 / 10", note: "deux datacenters logiques" },
          { label: "Pointe simulée", value: "300", note: "Cloudlets, pas d’utilisateurs réels" },
          { label: "Scaling max.", value: "20 VM", note: "seuil CPU de 70 %", style: "highlight" }
        ],
        methodTitle: "Lecture des résultats de pointe",
        bullets: [
          "TimeShared fixe : réponse moyenne 11,73 s ; makespan 76,11 s ; coût estimé 0,043376 $.",

          ${section.questions.map((qa, index) => `
            <details class="qa" data-question="${escapeAttr(qa[0])}" data-answer="${escapeAttr(qa[1])}">
              <summary><span class="qa-num">${String(index + 1).padStart(2, "0")}</span><span>${qa[0]}</span></summary>
              <div class="qa-answer"><p>${qa[1]}</p><div class="answer-tools"><button class="copy-answer" type="button">Copier la réponse</button></div></div>
            </details>`).join("")}
        </section>
        <div class="empty-state" id="empty-state">Aucun résultat dans cette partie. Essaie un autre mot-clé ou change de partie.</div>

        <div class="section-heading"><div><div class="section-kicker">Pour enchaîner</div><h2>${section.transitionTitle}</h2></div></div>
        <section class="closing"><div><h3>Transition orale</h3><p>${section.transition}</p></div><span class="status-tag">Besoin → méthode → résultat → limite</span></section>
        <footer class="footer">Support hors ligne · Basé sur le rapport du projet · Appuie sur 1–6 pour naviguer, ← / → pour changer d’étape.</footer>`;
      renderNav();
      applySearch();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function escapeAttr(value) {
      return value.replaceAll("&", "&amp;").replaceAll('"', "&quot;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
    }

    function switchSection(id) {
      const section = sections.find(item => item.id === id);
      if (!section) return;
      activeSection = id;
      activeStep = 0;
      search.value = "";
      renderSection();
    }

    function applySearch() {
      const query = search.value.trim().toLocaleLowerCase("fr");
      const questions = [...document.querySelectorAll(".qa")];
      let shown = 0;
      questions.forEach(card => {
        const match = !query || `${card.dataset.question} ${card.dataset.answer}`.toLocaleLowerCase("fr").includes(query);
        card.hidden = !match;
        if (match) shown++;
      });
      const status = document.getElementById("search-status");
      const empty = document.getElementById("empty-state");
      if (!status || !empty) return;
      status.style.display = query ? "block" : "none";
      status.textContent = query ? `${shown} question${shown > 1 ? "s" : ""} trouvée${shown > 1 ? "s" : ""} pour « ${search.value.trim()} » dans cette partie.` : "";
      empty.style.display = shown === 0 ? "block" : "none";
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2100);
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        showToast("Réponse copiée.");
      } catch {
        const area = document.createElement("textarea");
        area.value = text;
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.append(area);
        area.select();
        const copied = document.execCommand("copy");
        area.remove();
        showToast(copied ? "Réponse copiée." : "Copie impossible dans ce navigateur.");
      }
    }

    function openRandomQuestion(sectionId = activeSection) {
      const section = sections.find(item => item.id === sectionId);
      if (!section) return;
      const cards = [...document.querySelectorAll(".qa:not([hidden])")];
      if (!cards.length) {
        switchSection(sectionId);
        return;
      }
      const card = cards[Math.floor(Math.random() * cards.length)];
      card.open = true;
      card.scrollIntoView({ behavior: "smooth", block: "center" });
      card.classList.add("random-focus");
      setTimeout(() => card.classList.remove("random-focus"), 1100);
    }

    nav.addEventListener("click", event => {
      const button = event.target.closest("[data-section]");
      if (button) switchSection(button.dataset.section);
    });

    content.addEventListener("click", event => {
      const stepButton = event.target.closest("[data-step]");
      if (stepButton) {
        activeStep = Number(stepButton.dataset.step);
        renderSection();
        document.querySelector(".workflow").scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }
      const copyButton = event.target.closest(".copy-answer");
      if (copyButton) {
        const card = copyButton.closest(".qa");
        copyText(card.dataset.answer);
        return;
      }
      if (event.target.closest("#toggle-answers")) {
        const cards = [...document.querySelectorAll(".qa:not([hidden])")];
        const shouldOpen = cards.some(card => !card.open);
        cards.forEach(card => card.open = shouldOpen);
        event.target.closest("#toggle-answers").textContent = shouldOpen ? "Tout fermer" : "Tout ouvrir";
        return;
      }
      if (event.target.closest("#random-in-section")) {
        openRandomQuestion();
        return;
      }
      if (event.target.closest("#open-first-answer")) {
        const first = document.querySelector(".qa:not([hidden])");
        if (first) {
          first.open = true;
          first.scrollIntoView({ behavior: "smooth", block: "center" });
        } else {
          document.getElementById("qa-heading").scrollIntoView({ behavior: "smooth" });
        }
      }
    });

    search.addEventListener("input", applySearch);
    document.getElementById("print").addEventListener("click", () => window.print());
    document.getElementById("random-question").addEventListener("click", () => openRandomQuestion());
    document.addEventListener("keydown", event => {
      if (event.target.matches("input, textarea, select") || event.ctrlKey || event.metaKey || event.altKey) return;
      if (/^[1-6]$/.test(event.key)) switchSection(sections[Number(event.key) - 1].id);
      if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
        const section = sections.find(item => item.id === activeSection);
        const direction = event.key === "ArrowRight" ? 1 : -1;
        activeStep = (activeStep + direction + section.steps.length) % section.steps.length;
        renderSection();
        document.querySelector(".workflow").scrollIntoView({ behavior: "smooth", block: "center" });
      }
    });

    renderSection();
  </script>
</body>
</html>
